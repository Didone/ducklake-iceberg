name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.5.1"

jobs:
  lock:
    name: lock file is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: poetry.lock matches pyproject.toml
        run: poetry check --lock

  quality:
    name: lint and type check
    runs-on: ubuntu-latest
    needs: lock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - run: poetry install --sync
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy

  build:
    name: build and check distributions
    runs-on: ubuntu-latest
    needs: lock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: Build sdist and wheel
        run: poetry build
      - name: Validate package metadata
        run: pipx run twine check --strict dist/*
      - name: Install the wheel in a clean virtualenv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/ducklake-iceberg --version
          /tmp/wheel-venv/bin/ducklake-iceberg sync --help > /dev/null

  container-smoke:
    name: container (offline smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image and extensions
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ducklake-iceberg:ci .
      - name: Verify offline CLI and non-root runtime
        run: |
          docker run --rm --network none ducklake-iceberg:ci sync --help
          test "$(docker run --rm --network none --entrypoint id ducklake-iceberg:ci -u)" = 10001
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ducklake-iceberg:ci)" = "$GITHUB_SHA"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.created" }}' ducklake-iceberg:ci)" != unknown

  portability:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lock
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - run: poetry install --sync
      - name: CLI starts
        run: poetry run ducklake-iceberg --version
      - name: Unit tests, per-table lock and the mapping/writer suites
        run: poetry run pytest tests/unit tests/sync tests/mapping tests/writer -m "not postgres and not e2e and not minio" --cov-fail-under=0

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lock
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - run: poetry install --sync
      - name: Unit and fast integration tests (SQLite catalog)
        run: poetry run pytest -m "not postgres and not e2e and not minio"
      - name: Integration tests against Postgres
        if: matrix.python == '3.12'
        # Backend parity run: the global coverage gate is enforced by the fast
        # step above; here the SAME suite only has to pass against Postgres.
        run: poetry run pytest -m postgres --cov-fail-under=0
      - name: End-to-end zero-copy audit against MinIO
        if: matrix.python == '3.12'
        run: poetry run pytest -m minio --cov-fail-under=0
