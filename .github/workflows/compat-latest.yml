name: compat-latest

# Runs the test suite against the NEWEST DuckDB, DuckDB extensions (ducklake,
# postgres, httpfs, aws, sqlite) and PyIceberg, to learn ahead of time whether
# the next release breaks the writer or the catalog reader. It never blocks a
# merge: it is a separate workflow (not a required check), runs on a schedule
# or manually, and uses continue-on-error. The `pins` tests are excluded
# because divergence is the point here; the version report goes to the run
# summary.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      pre:
        description: "Include pre-releases (pip --pre)"
        type: boolean
        default: false
      extension_repository:
        description: "DuckDB extension repository"
        type: choice
        options: [core, core_nightly]
        default: core

permissions:
  contents: read

env:
  POETRY_VERSION: "2.5.1"

jobs:
  latest:
    name: suite against the newest versions
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PIP_PRE: ${{ inputs.pre && '--pre' || '' }}
      EXT_REPO: ${{ inputs.extension_repository || 'core' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - run: poetry install --sync
      - name: Upgrade duckdb and pyiceberg beyond the pinned versions
        run: |
          poetry run python -m pip install --upgrade $PIP_PRE duckdb "pyiceberg[glue,s3fs]"
          poetry run python -m pip check || echo "::warning::pip check: dependency conflict with the newer versions"
      - name: Reinstall the extensions from the chosen repository
        run: |
          poetry run python - <<'EOF'
          import os
          import duckdb

          repo = os.environ["EXT_REPO"]
          con = duckdb.connect()
          for ext in ("ducklake", "postgres", "httpfs", "aws", "sqlite"):
              con.execute(f"FORCE INSTALL {ext} FROM {repo}")
          print(con.execute(
              "SELECT extension_name, extension_version, installed_from "
              "FROM duckdb_extensions() WHERE installed ORDER BY 1"
          ).fetchall())
          EOF
      - name: Found versus pinned versions
        run: |
          {
            echo '### Versions (ducklake_iceberg.deps)'
            echo '```json'
            poetry run python -m ducklake_iceberg.deps --report-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Writer round trip through the PyIceberg reader
        run: poetry run pytest -m roundtrip --cov-fail-under=0
      - name: Fast suite (SQLite catalog)
        if: ${{ !cancelled() }}
        run: poetry run pytest -m "not postgres and not e2e and not pins" --cov-fail-under=0
      - name: Integration tests against Postgres
        if: ${{ !cancelled() }}
        run: poetry run pytest -m "postgres and not pins" --cov-fail-under=0
