name: release

# Publishes final versions and pre-releases to PyPI when a `v*` tag is pushed.
# Pre-releases are also marked as such on GitHub. Publishing uses Trusted
# Publishing (OIDC): no API token is stored in the repository. One-time setup:
#   1. On PyPI, add a trusted publisher for this repository with the workflow
#      name `release.yml` and the environment name `pypi`.
#   2. In GitHub, create the `pypi` environment (optionally with required reviewers).
# Release policy: see CONTRIBUTING.md#releasing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  POETRY_VERSION: "2.5.1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: Validate release tag
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME" --changelog CHANGELOG.md
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check lock and build distributions
        run: |
          poetry check --lock
          poetry build
      - name: Validate package metadata
        run: pipx run twine check --strict dist/*
      - name: Install the wheel in a clean virtualenv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/ducklake-iceberg --version
      - uses: actions/upload-artifact@v7
        with:
          name: ducklake-iceberg-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  container-smoke:
    name: container image smoke test
    runs-on: ubuntu-latest
    needs: build
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: |
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "ducklake-iceberg:$VERSION" .
      - name: Smoke test (offline, non-root, labels)
        run: |
          image="ducklake-iceberg:$VERSION"
          docker run --rm --network none "$image" sync --help
          docker run --rm --network none "$image" --version
          test "$(docker run --rm --network none --entrypoint id "$image" -u)" = 10001
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$VERSION"
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, container-smoke]
    environment:
      name: pypi
      url: https://pypi.org/project/ducklake-iceberg/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ducklake-iceberg-${{ github.ref_name }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ducklake-iceberg-${{ github.ref_name }}
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            "${args[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
